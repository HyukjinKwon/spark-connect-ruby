name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # for creating the GitHub release

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # We can't use "bundler-cache: true" here because
          # rubygems-requirements-system isn't triggered when Bundler
          # cache is available.
          # bundler-cache: true

      # Always run "bundle install" manually to trigger
      # rubygems-requirements-system that install Apache Arrow GLib
      # automatically.
      - name: Install dependencies
        run: bundle install

      - name: Verify version matches tag
        run: |
          GEM_VERSION="v$(ruby -r ./lib/spark_connect/version -e 'print SparkConnect::VERSION')"
          if [ "$GEM_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gem version ${GEM_VERSION}" >&2
            exit 1
          fi

      - name: Run unit specs
        run: bundle exec rake spec

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      # Publish to RubyGems using an API key stored as the GEM_TOKEN repository
      # secret. (Set GEM_TOKEN to a rubygems.org API key with "push" scope.)
      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_TOKEN }}
        run: |
          gem build spark-connect.gemspec
          gem push spark-connect-*.gem
